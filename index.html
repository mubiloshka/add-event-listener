<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Counter</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1>Counter</h1>
    <div class="input">
      <input type="number" id="input" placeholder="Enter your number" />
      <button id="sendbtn">Send</button>
    </div>

    <div class="counter">
      <button id="minus">−</button>
      <span id="tsifra" style="color: red;">7</span>
      <button id="plus">+</button>
    </div>

    <label for="vibor">Select color</label>
    <input type="color" id="vibor" value="#ff0000" />
  </div>

  <script src="script.js"></script>
</body>
</html>
